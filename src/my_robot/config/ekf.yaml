ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    use_sim_time: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Wheel odometry: fuse the wheel POSE (x, y, yaw) in differential mode, i.e. the EKF turns
    # consecutive wheel poses into velocities using the message timestamps.
    # Reason (measured with tools/odom_check.py): the wheel pose is accurate, but fusing the
    # controller's reported twist made the EKF over-count turns and distance by about 4%.
    odom0: /diff_drive_controller/odom
    odom0_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: true
    odom0_relative: false

    # IMU: yaw rate from the gyro
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true