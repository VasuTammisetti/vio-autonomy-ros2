name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8
      - name: flake8 (blocking) - syntax errors and undefined names
        run: flake8 tools tests --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: flake8 (report only) - style
        run: flake8 tools tests --count --exit-zero --max-line-length=120 --statistics

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit pip-audit
      - name: bandit - medium and high severity fail the build
        run: bandit -r tools -ll
      - name: pip-audit - known CVEs in Python dependencies
        run: pip-audit -r requirements.txt

  test:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: install test deps
        run: apt-get update && apt-get install -y --no-install-recommends python3-pytest python3-numpy python3-yaml
      - name: pytest
        run: |
          source /opt/ros/jazzy/setup.bash
          python3 -m pytest -v tests
